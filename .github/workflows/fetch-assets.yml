name: shoot-whatseaze
on:
  push:
    branches: [pdf-assets]
    paths: [pdf-assets/shoot.py, .github/workflows/fetch-assets.yml]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p pdf-assets/ws && python pdf-assets/shoot.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A pdf-assets; git commit -m "Site shots [skip ci]" || true; git push
